steps:
# Instalasi dependencies
- name: 'gcr.io/cloud-builders/npm'
  args: ['install', '--legacy-peer-deps']

- name: 'gcr.io/cloud-builders/npm'
  args: ['run', 'build']

#Make sure dependencies
- name: 'gcr.io/cloud-builders/npm'
  args: ['install']

# Deploy aplikasi ke App Engine
- name: 'gcr.io/cloud-builders/gcloud'
  args: ['app', 'deploy']